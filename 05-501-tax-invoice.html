<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手寫統一發票與 5% 營業稅試算機 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上手寫發票計算機。輸入金額自動計算未稅價、含稅價與 5% 營業稅，同步生成標準國字金額大寫（壹, 貳, 參...），附發票防錯填寫預覽。100% 本機計算不上傳。">
    <meta name="keywords" content="買便當,手寫發票,營業稅計算,5%營業稅,金額大寫,國字大寫,三聯式發票,發票試算">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/05-501-tax-invoice.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .invoice-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .invoice-preview-box {
            background: var(--panel-bg);
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .chinese-num-output {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ea580c;
            letter-spacing: 2px;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            display: inline-block;
            margin-top: 8px;
            word-break: break-all;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-copy {
            background: #ea580c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
            transition: background 0.2s;
        }
        .btn-copy:hover { background: #c2410c; }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 手寫發票與 5% 營業稅計算機</li>
            </ol>
        </nav>

        <div class="invoice-card">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 10px;">🧾 手寫發票與 5% 營業稅試算機</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">專為台灣開立三聯式/兩聯式發票設計！輸入任意金額自動求出未稅價、稅額與總價，並生成標準國字金額大寫，再也不怕寫錯作廢。</p>

            <div class="calc-grid">
                <div>
                    <label for="input-amount" style="font-weight:bold; display:block; margin-bottom:6px;">輸入金額 (新台幣 NT$)</label>
                    <input type="number" id="input-amount" class="form-control" placeholder="請輸入數字..." oninput="calculateInvoice()">
                </div>
                <div>
                    <label for="calc-mode" style="font-weight:bold; display:block; margin-bottom:6px;">金額類型</label>
                    <select id="calc-mode" class="form-control" onchange="calculateInvoice()">
                        <option value="inclusive">含稅總金額 (內含 5% 營業稅)</option>
                        <option value="exclusive">未稅銷售額 (外加 5% 營業稅)</option>
                    </select>
                </div>
            </div>

            <div style="background: var(--panel-bg); border-radius: 8px; padding: 18px; border: 1px solid var(--border-light);">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:1rem;">
                    <span>銷售額 (未稅金額)：</span>
                    <strong id="res-sales" style="font-size:1.1rem;">NT$ 0</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:1rem;">
                    <span>營業稅額 (5% 四捨五入)：</span>
                    <strong id="res-tax" style="color:#3b82f6; font-size:1.1rem;">NT$ 0</strong>
                </div>
                <div style="display:flex; justify-content:space-between; border-top:1px solid var(--border-light); padding-top:10px; font-size:1.1rem;">
                    <span><b>總計 (含稅金額)：</b></span>
                    <strong id="res-total" style="color:#ea580c; font-size:1.25rem;">NT$ 0</strong>
                </div>
            </div>

            <!-- 發票大寫預覽區 -->
            <div class="invoice-preview-box">
                <div style="font-weight:bold; color:var(--body-text); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                    <span>✍️ 發票填寫國字金額大寫 (中文大寫)：</span>
                    <button type="button" class="btn-copy" onclick="copyChineseNum()">一鍵複製大寫</button>
                </div>
                <div class="chinese-num-output" id="res-chinese">零圓整</div>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function calculateInvoice() {
            const val = parseFloat(document.getElementById('input-amount').value);
            const mode = document.getElementById('calc-mode').value;

            if (isNaN(val) || val <= 0) {
                document.getElementById('res-sales').innerText = 'NT$ 0';
                document.getElementById('res-tax').innerText = 'NT$ 0';
                document.getElementById('res-total').innerText = 'NT$ 0';
                document.getElementById('res-chinese').innerText = '零圓整';
                return;
            }

            let sales = 0, tax = 0, total = 0;

            if (mode === 'inclusive') {
                total = Math.round(val);
                sales = Math.round(total / 1.05);
                tax = total - sales;
            } else {
                sales = Math.round(val);
                tax = Math.round(sales * 0.05);
                total = sales + tax;
            }

            document.getElementById('res-sales').innerText = 'NT$ ' + sales.toLocaleString();
            document.getElementById('res-tax').innerText = 'NT$ ' + tax.toLocaleString();
            document.getElementById('res-total').innerText = 'NT$ ' + total.toLocaleString();

            document.getElementById('res-chinese').innerText = numberToChinese(total);
        }

        function numberToChinese(n) {
            if (n === 0) return '零圓整';
            const digit = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            const unit = [['圓', '萬', '億', '兆'], ['', '拾', '佰', '仟']];

            let head = n < 0 ? '負' : '';
            n = Math.abs(n);

            let s = '';
            for (let i = 0; i < unit[0].length && n > 0; i++) {
                let p = '';
                for (let j = 0; j < unit[1].length && n > 0; j++) {
                    p = digit[n % 10] + unit[1][j] + p;
                    n = Math.floor(n / 10);
                }
                s = p.replace(/(零.)*零$/, '').replace(/^$/, '零') + unit[0][i] + s;
            }

            return head + s.replace(/(零.)*零圓/, '圓').replace(/(零.)+/g, '零').replace(/^圓/, '零圓') + '整';
        }

        function copyChineseNum() {
            const txt = document.getElementById('res-chinese').innerText;
            navigator.clipboard.writeText(txt).then(() => {
                alert('已成功複製金額大寫：' + txt);
            });
        }
    </script>
</body>
</html>
