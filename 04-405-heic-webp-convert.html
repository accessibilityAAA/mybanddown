<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC & WebP 轉 JPG/PNG 純前端轉檔器 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上 HEIC 與 WebP 圖片轉檔工具，支援將 iPhone HEIC 照片及 WebP 圖檔批次轉換為 JPG 或 PNG。100% 純前端瀏覽器處理，照片不上傳伺服器，安全零洩密風險。">
    <meta name="keywords" content="HEIC轉JPG,WebP轉JPG,HEIC轉PNG,iPhone照片轉檔,線上圖片轉檔,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/04-405-heic-webp-convert.html">

    <!-- 🌟 深夜模式防閃爍極速預載腳本 -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">

    <style>
        .drop-zone {
            border: 2px dashed var(--border-light);
            border-radius: 8px; padding: 40px 20px;
            text-align: center; background: var(--panel-bg);
            cursor: pointer; transition: all 0.2s ease; margin-bottom: 20px;
        }
        .drop-zone:hover { border-color: #ea580c; background: var(--card-bg); }
        .drop-icon { font-size: 2.8rem; margin-bottom: 10px; }

        .setting-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--panel-bg); padding: 15px 20px;
            border-radius: 8px; border: 1px solid var(--border-light);
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        .setting-item {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: bold; color: var(--desc-text);
        }

        .file-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 8px; padding: 12px 16px;
        }
        .file-info { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--body-text); }
        .file-status { font-size: 0.85rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .status-wait { background: var(--panel-bg); color: var(--desc-text); }
        .status-loading { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .status-done { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .action-btns { display: flex; gap: 12px; justify-content: flex-end; }
        .btn-tool {
            padding: 10px 20px; border-radius: 6px; border: none;
            font-weight: bold; font-size: 0.95rem; cursor: pointer;
        }
        .btn-convert { background: #ea580c; color: #ffffff; }
        .btn-convert:hover { background: #c2410c; }
        .btn-convert:disabled { background: var(--border-light); cursor: not-allowed; }
        .btn-clear { background: var(--panel-bg); color: var(--body-text); border: 1px solid var(--border-light); }
    </style>

    <script src="js/components.js" defer></script>
    <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" tabindex="-1">
        <div class="tool-card-box">
            <h1 style="color:var(--title-blue); font-size:1.4rem; margin-bottom:12px; border-bottom:2px solid var(--border-light); padding-bottom:8px;">
                🖼️ HEIC & WebP 轉 JPG/PNG 圖片轉檔器
            </h1>
            <p style="color: var(--desc-text); font-size: 0.9rem;">
                將 iPhone 拍攝的 <strong>.heic</strong> 照片或網頁 <strong>.webp</strong> 圖片輕鬆批次轉換為泛用性高的 JPG 或 PNG 格式。<strong>100% 純前端處理，照片絕不上傳伺服器！</strong>
            </p>

            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="drop-icon">🔄</div>
                <div style="font-weight:bold; color:var(--body-text); font-size:1.05rem;">點擊或拖曳 HEIC / WebP 圖片至此</div>
                <div style="font-size:0.85rem; color:var(--desc-text); margin-top:6px;">支援批次選擇多張圖片 (.heic, .heif, .webp)</div>
                <input type="file" id="file-input" accept=".heic,.heif,.webp,image/heic,image/heif,image/webp" multiple style="display:none;" onchange="handleFilesSelect(event)">
            </div>

            <div class="setting-bar">
                <div class="setting-item">
                    <span>目標輸出格式：</span>
                    <select class="form-control" id="target-format" style="width: auto;">
                        <option value="image/jpeg" selected>JPG (.jpg)</option>
                        <option value="image/png">PNG (.png)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span>JPG 壓縮畫質：</span>
                    <select class="form-control" id="jpg-quality" style="width: auto;">
                        <option value="0.92" selected>高畫質 (92%)</option>
                        <option value="0.8">標準 (80%)</option>
                        <option value="0.65">高壓縮小檔案 (65%)</option>
                    </select>
                </div>
            </div>

            <div class="file-list" id="file-list-container"></div>

            <div class="action-btns">
                <button type="button" class="btn-tool btn-clear" onclick="clearAllFiles()">🗑️ 清空列表</button>
                <button type="button" class="btn-tool btn-convert" id="btn-start" disabled onclick="startConversion()">🚀 開始轉換並下載</button>
            </div>
        </div>
    </main>

    <div id="global-footer"></div>

    <script>
        let fileQueue = [];

        function handleFilesSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                fileQueue.push({
                    id: 'file-' + Math.random().toString(36).substr(2, 9),
                    fileObj: file,
                    status: 'wait',
                    convertedBlob: null
                });
            });

            renderFileList();
            document.getElementById('btn-start').disabled = false;
        }

        function renderFileList() {
            const container = document.getElementById('file-list-container');
            if (fileQueue.length === 0) {
                container.innerHTML = '';
                document.getElementById('btn-start').disabled = true;
                return;
            }

            let html = '';
            fileQueue.forEach(item => {
                let statusTag = '';
                if (item.status === 'wait') statusTag = '<span class="file-status status-wait">等待轉換</span>';
                else if (item.status === 'loading') statusTag = '<span class="file-status status-loading">⏳ 轉換中...</span>';
                else if (item.status === 'done') statusTag = '<span class="file-status status-done">✓ 轉換成功</span>';
                else if (item.status === 'error') statusTag = '<span class="file-status status-error">✕ 轉換失敗</span>';

                const sizeMB = (item.fileObj.size / (1024 * 1024)).toFixed(2);

                html += `
                    <div class="file-item" id="${item.id}">
                        <div class="file-info">
                            <span>📷</span>
                            <strong>${item.fileObj.name}</strong>
                            <span style="color:var(--desc-text); font-size:0.8rem;">(${sizeMB} MB)</span>
                        </div>
                        <div>${statusTag}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function clearAllFiles() {
            fileQueue = [];
            document.getElementById('file-input').value = '';
            renderFileList();
        }

        async function startConversion() {
            if (fileQueue.length === 0) return;

            const btnStart = document.getElementById('btn-start');
            btnStart.disabled = true;

            const mimeType = document.getElementById('target-format').value;
            const quality = parseFloat(document.getElementById('jpg-quality').value);
            const ext = mimeType === 'image/jpeg' ? '.jpg' : '.png';

            for (let item of fileQueue) {
                if (item.status === 'done') continue;

                item.status = 'loading';
                renderFileList();

                try {
                    let resultBlob = null;
                    const fileNameLower = item.fileObj.name.toLowerCase();

                    if (fileNameLower.endsWith('.heic') || fileNameLower.endsWith('.heif')) {
                        resultBlob = await heic2any({
                            blob: item.fileObj,
                            toType: mimeType,
                            quality: quality
                        });
                        if (Array.isArray(resultBlob)) resultBlob = resultBlob[0];
                    } else {
                        resultBlob = await convertWebpViaCanvas(item.fileObj, mimeType, quality);
                    }

                    item.convertedBlob = resultBlob;
                    item.status = 'done';
                    renderFileList();

                    const downloadName = item.fileObj.name.replace(/\.[^/.]+$/, "") + ext;
                    downloadBlob(resultBlob, downloadName);

                } catch (err) {
                    console.error("轉檔失敗：", err);
                    item.status = 'error';
                    renderFileList();
                }
            }

            btnStart.disabled = false;
        }

        function convertWebpViaCanvas(file, mimeType, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');

                    if (mimeType === 'image/jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);

                    canvas.toBlob(function (blob) {
                        if (blob) resolve(blob);
                        else reject(new Error("Canvas 轉檔失敗"));
                    }, mimeType, quality);
                };

                img.onerror = function () {
                    URL.revokeObjectURL(url);
                    reject(new Error("圖片載入失敗"));
                };

                img.src = url;
            });
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }
    </script>
</body>
</html>
