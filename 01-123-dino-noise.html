        .mascot-avatar {
            font-size: clamp(4.5rem, 10vw, 7rem);
            transition: transform 0.2s ease;
            display: inline-block;
            user-select: none;
            line-height: 1;

        .mascot-avatar.scared {
            animation: mascotShake 0.3s infinite;
        }

        @keyframes mascotShake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-4px, 0px) rotate(-4deg); }
            40% { transform: translate(4px, 3px) rotate(4deg); }
            60% { transform: translate(-3px, 1px) rotate(-2deg); }
            80% { transform: translate(3px, -2px) rotate(3deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }

                <!-- 🌟 無障礙動態進度條宣言 -->
                <div class="meter-bar-outer" id="meterBarOuter" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="90" aria-label="即時聲音分貝計">
                    <div class="meter-bar-inner" id="meterBar"></div>

                <!-- 核心操作按鈕 -->
                <div class="primary-action-group">
                    <button type="button" class="btn-start" id="startBtn" title="授權存取麥克風並啟動分貝監控" onclick="startMonitoring()">

                    <button type="button" class="btn-stop" id="stopBtn" title="停止分貝監控並重新計時" onclick="stopMonitoring()" disabled>

                    專為全台老師與班級管理打造的滿版聲音分貝監控神器！支援四季與節慶可愛吉祥物切換。全班保持安靜時吉祥物會開心累積專注時間；一旦有人講話太吵超過設定分貝，吉祥物就會嚇壞並將累積時間歸零重來！100% 本機純前端運算，絕不上傳音訊，安全保障學生隱私。

    <div id="global-footer"></div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isMonitoring = false;

        let dbThreshold = 45;
        let secondsAccumulated = 0;
        let timerInterval = null;
        let targetTotalSeconds = 300;

        let currentTheme = 'cat';
        const themeConfig = {
            cat: { normal: '🐱', scared: '🙀💥', win: '🎉😻👑', name: '暖心貓咪' },
            dog: { normal: '🐶', scared: '🙀💥', win: '🎉🐶👑', name: '忠誠柴犬' },
            bear: { normal: '🐻', scared: '🐻‍❄️💥', win: '🎉🐻👑', name: '棕熊寶貝' },
            sakura: { normal: '🌸', scared: '🥀💥', win: '🎉🌸👑', name: '春日櫻花' },
            pumpkin: { normal: '🎃', scared: '👻💥', win: '🎉🍬👑', name: '萬聖南瓜' },
            tree: { normal: '🎄', scared: '❄️💥', win: '🎉🎁👑', name: '聖誕小樹' },
            school: { normal: '🏫', scared: '🔔💥', win: '🎉📚👑', name: '學校上課' },
            grad: { normal: '🎓', scared: '📜💥', win: '🎉🎓👑', name: '畢業博士' }
        };

        let soundCtx = null;
        function getSoundContext() {
            if (!soundCtx) {
                soundCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (soundCtx.state === 'suspended') {
                soundCtx.resume();
            }
            return soundCtx;
        }

        function playScaredSound() {
            const ctxAudio = getSoundContext();
            const osc = ctxAudio.createOscillator();
            const gain = ctxAudio.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, ctxAudio.currentTime);
            osc.frequency.exponentialRampToValueAtTime(250, ctxAudio.currentTime + 0.35);
            gain.gain.setValueAtTime(0.25, ctxAudio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.35);
            osc.connect(gain); gain.connect(ctxAudio.destination);
            osc.start(); osc.stop(ctxAudio.currentTime + 0.35);
        }

        function playVictorySound() {
            const ctxAudio = getSoundContext();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const startTime = ctxAudio.currentTime + idx * 0.1;
                gain.gain.setValueAtTime(0.2, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                osc.connect(gain); gain.connect(ctxAudio.destination);
                osc.start(startTime); osc.stop(startTime + 0.3);
            });
        }

        function changeTheme(themeKey, btn) {
            currentTheme = themeKey;
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');

            const cfg = themeConfig[themeKey];
            if (!isMonitoring) {
                document.getElementById('mascotIcon').innerText = cfg.normal;
                document.getElementById('statusText').innerText = `準備就緒，按下「啟動吉祥物監控」，讓【${cfg.name}】陪伴大家！`;
            }
        }

        function updateThreshold(val) {
            dbThreshold = parseInt(val, 10);
            document.getElementById('thresholdValue').innerText = dbThreshold;
        }

        function updateTimeSlider(val) {
            const mins = parseInt(val, 10);
            document.getElementById('sliderTimeDisplay').innerText = mins;
            if (!isMonitoring) {
                targetTotalSeconds = mins * 60;
            }
        }

        async function startMonitoring() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                isMonitoring = true;
                secondsAccumulated = 0;
                targetTotalSeconds = parseInt(document.getElementById('timeSlider').value, 10) * 60;

                const cfg = themeConfig[currentTheme];
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('timeSlider').disabled = true;
                document.getElementById('mascotIcon').innerText = cfg.normal;
                document.getElementById('mascotIcon').classList.remove('scared');
                document.getElementById('statusText').innerText = `🟢 監控中：全班保持安靜，【${cfg.name}】正在開心累積專注時間！`;

                startTimer();

                javascriptNode.onaudioprocess = function() {
                    if (!isMonitoring) return;
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    for (let i = 0; i < array.length; i++) {
                        values += array[i];
                    }
                    const average = values / array.length;
                    const currentDb = Math.round(average);

                    document.getElementById('dbValue').innerText = currentDb;
                    document.getElementById('meterBarOuter').setAttribute('aria-valuenow', currentDb);
                    
                    const percent = Math.min(100, Math.round((currentDb / 90) * 100));
                    const meter = document.getElementById('meterBar');
                    meter.style.width = percent + '%';

                    if (currentDb > dbThreshold) {
                        meter.style.backgroundColor = '#ef4444';
                        triggerViolation(currentDb);
                    } else {
                        meter.style.backgroundColor = '#22c55e';
                    }
                };

            } catch (err) {
                alert('無法存取麥克風！請確認瀏覽器已允許麥克風權限。');
            }
        }

        function triggerViolation(db) {
            playScaredSound();
            secondsAccumulated = 0;
            updateTimerDisplay();

            const cfg = themeConfig[currentTheme];
            const mascot = document.getElementById('mascotIcon');
            mascot.innerText = cfg.scared;
            mascot.classList.add('scared');
            document.getElementById('statusText').innerText = `🚨 警告！聲音超標 (${db} dB)！【${cfg.name}】嚇壞了，專注時間歸零重來！`;

            setTimeout(() => {
                if (isMonitoring) {
                    mascot.innerText = cfg.normal;
                    mascot.classList.remove('scared');
                    document.getElementById('statusText').innerText = `🟢 繼續監控中：請保持安靜重新累積時間！`;
                }
            }, 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isMonitoring) return;
                secondsAccumulated++;
                updateTimerDisplay();

                if (secondsAccumulated >= targetTotalSeconds) {
                    handleVictory();
                }
            }, 1000);
        }

        function handleVictory() {
            stopMonitoring();
            playVictorySound();
            const cfg = themeConfig[currentTheme];
            document.getElementById('mascotIcon').innerText = cfg.win;
            document.getElementById('statusText').innerText = `🏆 太棒了！全班成功達成安靜目標，【${cfg.name}】給全班頒發皇冠！`;
        }

        function updateTimerDisplay() {
            const m = Math.floor(secondsAccumulated / 60).toString().padStart(2, '0');
            const s = (secondsAccumulated % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;
        }

        function stopMonitoring() {
            isMonitoring = false;
            clearInterval(timerInterval);

            if (javascriptNode) javascriptNode.onaudioprocess = null;
            if (microphone && microphone.mediaStream) {
                microphone.mediaStream.getTracks().forEach(track => track.stop());
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('timeSlider').disabled = false;
            document.getElementById('meterBar').style.width = '0%';
            document.getElementById('dbValue').innerText = '0';
            document.getElementById('meterBarOuter').setAttribute('aria-valuenow', '0');
        }
    </script>
