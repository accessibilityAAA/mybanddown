<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 列印排版與證件影本合併工具 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上 PDF 列印排版工具，支援多頁併一頁 (2併1/4併1)、身分證/健保卡正反面合併印同一頁，100% 純前端處理免上傳檔案，保障個人隱私。">
    <meta name="keywords" content="PDF列印排版,PDF多頁合併,身分證影本合併,證件照影本,2併1,4併1,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/03-301-pdf-print-layout.html">

    <!-- 🌟 深夜模式防閃爍極速預載腳本 -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">

    <style>
        .mode-tabs { display: flex; gap: 10px; margin: 20px 0; }
        .mode-btn {
            padding: 10px 20px; border-radius: 6px;
            border: 1px solid var(--border-light);
            background: var(--panel-bg); color: var(--body-text);
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .mode-btn.active {
            background: #ea580c; color: #ffffff; border-color: #ea580c;
        }

        .upload-area {
            border: 2px dashed var(--border-light);
            border-radius: 8px; padding: 35px 20px; text-align: center;
            background: var(--panel-bg); cursor: pointer; transition: all 0.2s;
        }
        .upload-area:hover { border-color: #ea580c; background: var(--card-bg); }
        .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }

        .setting-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin: 20px 0; background: var(--panel-bg);
            padding: 15px; border-radius: 8px; border: 1px solid var(--border-light);
        }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: bold;
            color: var(--desc-text); margin-bottom: 6px;
        }

        .btn-action {
            width: 100%; padding: 12px; background: #ea580c;
            color: #ffffff; border: none; border-radius: 6px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-action:hover { background: #c2410c; }
        .btn-action:disabled { background: var(--border-light); cursor: not-allowed; }

        .file-info { margin-top: 15px; font-size: 0.9rem; color: #22c55e; font-weight: bold; }
    </style>

    <script src="js/components.js" defer></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" tabindex="-1">
        <div class="tool-card-box">
            <h1 style="color:var(--title-blue); font-size:1.4rem; margin-bottom:12px; border-bottom:2px solid var(--border-light); padding-bottom:8px;">
                📄 PDF 列印排版與證件影本工具
            </h1>
            <p style="color: var(--desc-text); font-size: 0.9rem;">
                將多頁 PDF 併為一頁排版，或將身分證/健保卡正反面合併至同一張 A4 PDF 中。<strong>100% 純前端處理，檔案絕不上傳伺服器！</strong>
            </p>

            <div class="mode-tabs">
                <button type="button" class="mode-btn active" onclick="switchMode('nup', this)">多頁併一頁 (N-up)</button>
                <button type="button" class="mode-btn" onclick="switchMode('idcard', this)">身分證/證件正反面影本</button>
            </div>

            <div class="upload-area" onclick="document.getElementById('pdf-input').click()">
                <div class="upload-icon">📥</div>
                <div style="font-weight:bold; color:var(--body-text);">點擊或拖曳 PDF / 證件圖片至此</div>
                <div style="font-size:0.82rem; color:var(--desc-text); margin-top:5px;" id="upload-hint">支援 PDF 格式 (多頁排版)</div>
                <input type="file" id="pdf-input" accept="application/pdf,image/*" style="display:none;" multiple onchange="handleFileSelect(event)">
            </div>

            <div class="file-info" id="file-info" style="display:none;"></div>

            <div class="setting-grid" id="panel-nup">
                <div class="form-group">
                    <label>併頁模式</label>
                    <select class="form-control" id="nup-layout">
                        <option value="2">2 頁併 1 頁 (左右)</option>
                        <option value="4" selected>4 頁併 1 頁 (2x2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>紙張方向</label>
                    <select class="form-control" id="nup-orientation">
                        <option value="portrait" selected>直向 (Portrait)</option>
                        <option value="landscape">橫向 (Landscape)</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn-action" id="btn-process" disabled onclick="processPDF()">開始生成並下載 PDF</button>
        </div>
    </main>

    <div id="global-footer"></div>

    <script>
        let currentMode = 'nup';
        let selectedFiles = [];

        function switchMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const hint = document.getElementById('upload-hint');
            const nupPanel = document.getElementById('panel-nup');

            if (mode === 'nup') {
                hint.innerText = "支援 PDF 格式";
                nupPanel.style.display = "grid";
                document.getElementById('pdf-input').accept = "application/pdf";
            } else {
                hint.innerText = "請同時選擇正面與反面圖片/PDF (共2個檔案)";
                nupPanel.style.display = "none";
                document.getElementById('pdf-input').accept = "image/*,application/pdf";
            }
            resetFiles();
        }

        function handleFileSelect(e) {
            selectedFiles = Array.from(e.target.files);
            const infoEl = document.getElementById('file-info');
            const btn = document.getElementById('btn-process');

            if (selectedFiles.length === 0) {
                resetFiles();
                return;
            }

            infoEl.style.display = 'block';
            infoEl.innerText = `✓ 已載入 ${selectedFiles.length} 個檔案：` + selectedFiles.map(f => f.name).join(', ');
            btn.disabled = false;
        }

        function resetFiles() {
            selectedFiles = [];
            document.getElementById('pdf-input').value = '';
            document.getElementById('file-info').style.display = 'none';
            document.getElementById('btn-process').disabled = true;
        }

        async function processPDF() {
            if (selectedFiles.length === 0) return;

            const btn = document.getElementById('btn-process');
            btn.innerText = "正在處理中...";
            btn.disabled = true;

            try {
                const { PDFDocument, PageSizes } = PDFLib;
                const newPdf = await PDFDocument.create();

                if (currentMode === 'nup') {
                    const fileBytes = await selectedFiles[0].arrayBuffer();
                    const srcPdf = await PDFDocument.load(fileBytes);
                    const pages = srcPdf.getPages();
                    const layout = parseInt(document.getElementById('nup-layout').value);

                    if (layout === 4) {
                        for (let i = 0; i < pages.length; i += 4) {
                            const newPage = newPdf.addPage(PageSizes.A4);
                            const { width, height } = newPage.getSize();
                            const halfW = width / 2;
                            const halfH = height / 2;

                            for (let j = 0; j < 4 && (i + j) < pages.length; j++) {
                                const [embedded] = await newPdf.embedPdf(srcPdf, [i + j]);
                                const posX = (j % 2) * halfW;
                                const posY = j < 2 ? halfH : 0;
                                newPage.drawPage(embedded, {
                                    x: posX + 10,
                                    y: posY + 10,
                                    width: halfW - 20,
                                    height: halfH - 20
                                });
                            }
                        }
                    }
                } else {
                    const newPage = newPdf.addPage(PageSizes.A4);
                    const { width, height } = newPage.getSize();

                    for (let i = 0; i < Math.min(selectedFiles.length, 2); i++) {
                        const file = selectedFiles[i];
                        const bytes = await file.arrayBuffer();
                        let img = file.type.includes('png') ? await newPdf.embedPng(bytes) : await newPdf.embedJpg(bytes);

                        const targetW = 240;
                        const targetH = 150;
                        const posX = (width - targetW) / 2;
                        const posY = height - (i + 1) * 220;

                        newPage.drawImage(img, { x: posX, y: posY, width: targetW, height: targetH });
                    }
                }

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `買便當排版PDF-${Date.now()}.pdf`;
                link.click();

            } catch (err) {
                alert("處理失敗，請確認檔案格式是否正確！");
                console.error(err);
            } finally {
                btn.innerText = "開始生成並下載 PDF";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
