<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全螢幕段考與目標倒數計時器 - 買便當 mybanddown</title>

    <meta name="description" content="專為老師與學生打造的全螢幕段考倒數計時器。大字清晰倒數、自訂班級鼓勵標語、支援滿版投影幕模式。100% 免費本機運行。">
    <meta name="keywords" content="買便當,段考倒數,倒數計時器,考試倒數,班級座位,全螢幕計時器,老師工具">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/06-604-exam-countdown.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .countdown-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .countdown-display {
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: 900;
            color: #ea580c;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            margin: 20px 0;
            background: var(--panel-bg);
            padding: 25px 15px;
            border-radius: 12px;
            border: 2px dashed var(--border-light);
            word-break: break-all;
        }
        .motto-banner {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--title-blue);
            margin-bottom: 15px;
        }
        .fullscreen-btn {
            background: #1e293b;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover { background: #334155; }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 全螢幕段考倒數計時器</li>
            </ol>
        </nav>

        <div class="countdown-card" id="countdownContainer">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">🎓 班級段考與重要目標倒數計時器</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">老師課堂與投影幕首選！設定段考日期與激勵標語，滿版大字顯示剩餘天數與時分秒。</p>

            <div style="max-width: 500px; margin: 0 auto 20px auto; text-align: left;">
                <label for="exam-title" style="font-weight:bold; display:block; margin-bottom:4px;">目標名稱 / 鼓勵標語</label>
                <input type="text" id="exam-title" class="form-control" value="距離第一次段考還有：" oninput="updateBanner()" style="margin-bottom:12px;">

                <label for="exam-date" style="font-weight:bold; display:block; margin-bottom:4px;">選擇目標日期與時間</label>
                <input type="datetime-local" id="exam-date" class="form-control" onchange="startTimer()">
            </div>

            <div class="motto-banner" id="mottoDisplay">距離第一次段考還有：</div>
            
            <div class="countdown-display" id="timerDisplay">00 天 00 時 00 分 00 秒</div>

            <button type="button" class="fullscreen-btn" onclick="toggleFullScreen()">📺 開啟全螢幕投影模式</button>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        let timerInterval = null;

        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 14);
        document.getElementById('exam-date').value = defaultDate.toISOString().slice(0, 16);

        function updateBanner() {
            document.getElementById('mottoDisplay').innerText = document.getElementById('exam-title').value;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            const targetTime = new Date(document.getElementById('exam-date').value).getTime();

            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = targetTime - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').innerText = "🎉 時間到！加油！";
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('timerDisplay').innerText = 
                    `${days.toString().padStart(2, '0')} 天 ${hours.toString().padStart(2, '0')} 時 ${minutes.toString().padStart(2, '0')} 分 ${seconds.toString().padStart(2, '0')} 秒`;
            }, 1000);
        }

        function toggleFullScreen() {
            const elem = document.getElementById('countdownContainer');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(`無法進入全螢幕: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        startTimer();
    </script>
</body>
</html>
