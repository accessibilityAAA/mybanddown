<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>問題回報與許願池 - 買便當 mybanddown</title>
    
    <meta name="description" content="買便當 mybanddown 意見反饋與問題回報區，提供工具錯誤回報、功能改善建議與全新工具許願。">
    <meta name="keywords" content="問題回報,意見反饋,工具許願,Bug回報,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/report.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>
</head>
<body>

    <a href="#main-content" class="skip-link" title="快速跳轉至網頁主要內容區塊">跳過導覽選單，直接進入主要內容區</a>

    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:0.625rem; margin-bottom: 1.25rem;">
            <ol style="list-style:none; padding:0; display:flex; gap:0.375rem; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區快速鍵 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:0.25rem;">:::主要內容區定位點</span>
                    </a>
                    <a href="index.html" title="點擊回到買便當首頁" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / 問題回報與許願池</li>
            </ol>
        </nav>
        
        <div class="tool-card-box">
            <h1 style="color:var(--title-blue); font-size:1.5rem; margin-bottom:0.75rem; border-bottom:0.125rem solid var(--border-light); padding-bottom:0.5rem;">
                🚨 問題回報與功能許願池
            </h1>
            <p style="margin-bottom: 1.25rem; color:var(--desc-text); max-width: 40ch;">
                使用工具時遇到了操作卡頓、顯示錯誤嗎？或者您希望買便當開發什麼新工具或小遊戲？歡迎隨時填寫下方表單反饋給我們，我們會第一時間進行修正與規劃！
            </p>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(17.5rem, 1fr)); gap: 1.25rem; margin-bottom: 1.5625rem;">
                <div style="background:var(--panel-bg); border:0.0625rem solid var(--border-light); border-radius:0.5rem; padding:1rem;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:0.375rem;">🛠️ 遭遇異常 BUG</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">工具無法運算、畫面錯位、點擊無反應或產生結果有誤。</p>
                </div>
                <div style="background:var(--panel-bg); border:0.0625rem solid var(--border-light); border-radius:0.5rem; padding:1rem;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:0.375rem;">💡 功能優化建議</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">現有工具使用不順手、希望增加特定自訂選項或下載格式。</p>
                </div>
                <div style="background:var(--panel-bg); border:0.0625rem solid var(--border-light); border-radius:0.5rem; padding:1rem;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:0.375rem;">🎁 新工具許願池</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">敲碗希望「買便當」為上班族打造哪款實用工具或舒壓遊戲。</p>
                </div>
            </div>

            <!-- 🛠️ 修正點：移除 height="800" 絕對 px，改以相對單位控制尺寸 -->
            <div style="width:100%; overflow:hidden; border-radius:0.5rem; border:0.0625rem solid var(--border-light);">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc_YOUR_FORM_ID_HERE/viewform?embedded=true" 
                        style="width:100%; height:50rem; border:none;" 
                        title="買便當線上問題回報與建議 Google 表單">載入中…</iframe>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>
