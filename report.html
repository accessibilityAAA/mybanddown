<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>問題回報與許願池 - 買便當 mybanddown</title>
    
    <!-- SEO 最佳化設定 -->
    <meta name="description" content="買便當 mybanddown 意見反饋與問題回報區，提供工具錯誤回報、功能改善建議與全新工具許願。">
    <meta name="keywords" content="問題回報,意見反饋,工具許願,Bug回報,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ea580c">

    <!-- SEO 宣告標準網址 -->
    <link rel="canonical" href="https://www.mybanddown.com/report.html">

    <!-- 深夜模式防閃爍極速預載腳本 -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>
</head>
<body>

    <!-- 無障礙跳頁連結 -->
    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>

    <!-- 1. 自動刷出 Header -->
    <div id="global-header"></div>

    <!-- 2. 主要內容區 -->
    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:10px; margin-bottom: 20px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:4px;">:::</span>
                    </a>
                    <a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / 問題回報與許願池</li>
            </ol>
        </nav>
        
        <div class="tool-card-box">
            <h1 style="color:var(--title-blue); font-size:1.5rem; margin-bottom:12px; border-bottom:2px solid var(--border-light); padding-bottom:8px;">
                🚨 問題回報與功能許願池
            </h1>
            <p style="margin-bottom: 20px; color:var(--desc-text);">
                使用工具時遇到了操作卡頓、顯示錯誤嗎？或者您希望買便當開發什麼新工具或小遊戲？歡迎隨時填寫下方表單反饋給我們，我們會第一時間進行修正與規劃！
            </p>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px;">
                <div style="background:var(--panel-bg); border:1px solid var(--border-light); border-radius:8px; padding:16px;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:6px;">🛠️ 遭遇異常 BUG</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">工具無法運算、畫面錯位、點擊無反應或產生結果有誤。</p>
                </div>
                <div style="background:var(--panel-bg); border:1px solid var(--border-light); border-radius:8px; padding:16px;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:6px;">💡 功能優化建議</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">現有工具使用不順手、希望增加特定自訂選項或下載格式。</p>
                </div>
                <div style="background:var(--panel-bg); border:1px solid var(--border-light); border-radius:8px; padding:16px;">
                    <h2 style="font-size:1.1rem; color:#ea580c; margin-bottom:6px;">🎁 新工具許願池</h2>
                    <p style="font-size:0.9rem; color:var(--desc-text);">敲碗希望「買便當」為上班族打造哪款實用工具或舒壓遊戲。</p>
                </div>
            </div>

            <!-- Google 表單嵌入容器 (請將 src 替換為您的 Google Form 內嵌連結) -->
            <div style="width:100%; overflow:hidden; border-radius:8px; border:1px solid var(--border-light);">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc_YOUR_FORM_ID_HERE/viewform?embedded=true" 
                        width="100%" 
                        height="800" 
                        frameborder="0" 
                        marginheight="0" 
                        marginwidth="0" 
                        title="問題回報表單">載入中…</iframe>
            </div>
        </div>

    </main>

    <!-- 3. 自動刷出 Footer -->
    <div id="global-footer"></div>

</body>
</html>
