<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>證件照製作與一鍵更換底色 - 買便當 mybanddown</title>

    <meta name="description" content="在家自製標準證件照與護照大頭照。一鍵替換白底、藍底、紅底，支援 1 吋、2 吋排版與 A4 沖洗列印。100% 本機處理不上傳。">
    <meta name="keywords" content="買便當,證件照,護照照片,證件照換底色,大頭照,證件照排版,1吋照片,2吋照片">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/04-403-id-photo.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .id-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .preview-box {
            width: 150px;
            height: 200px;
            border: 2px dashed var(--border-light);
            margin: 20px auto;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 證件照製作與一鍵更換底色</li>
            </ol>
        </nav>

        <div class="id-card" style="text-align:center;">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">📸 證件照製作與一鍵更換底色</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">在家自己製作標準 1 吋與 2 吋證件照，一鍵切換白底或藍底並排版於 A4 紙張。</p>

            <input type="file" id="photo-file" accept="image/*" class="form-control" style="max-width:300px; margin:0 auto;" onchange="loadPhoto(this)">

            <div class="preview-box" id="previewBox">預覽區域</div>

            <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
                <button type="button" class="tag-btn" onclick="setBg('#ffffff')">⚪ 純白底</button>
                <button type="button" class="tag-btn" onclick="setBg('#3b82f6')">🔵 藍色底</button>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function loadPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById('previewBox');
                    box.style.backgroundImage = `url(${e.target.result})`;
                    box.style.backgroundSize = 'cover';
                    box.innerText = '';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function setBg(color) {
            document.getElementById('previewBox').style.backgroundColor = color;
        }
    </script>
</body>
</html>
