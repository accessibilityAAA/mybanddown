<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 合併與拆分分割工具 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上【PDF 合併與拆分分割】工具，支援多個 PDF 檔案合併排序與指定頁碼抽取拆分，本機純前端處理不上傳。">
    <meta name="keywords" content="PDF合併,PDF拆分,PDF分割,提取PDF頁面,PDF工具,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/03-302-pdf-merge-split.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <!-- 🌟 顯式引入 CSS 標籤，保證本機 file:// 開啟不失真 -->
    <link rel="stylesheet" href="css/main.css">

    <!-- 輕量獨立 PDF 處理庫 pdf-lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="js/components.js" defer></script>

    <style>
        .pdf-card {
            background: var(--card-bg, #ffffff);
            border: 0.0625rem solid var(--border-light, #e2e8f0);
            border-radius: 0.75rem;
            padding: 1.25rem;
            width: 100%;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.03);
            margin: 0.5rem 0;
            box-sizing: border-box;
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .tab-btn {
            background: var(--panel-bg);
            border: 0.0625rem solid var(--border-light);
            color: var(--body-text);
            padding: 0.625rem 1.25rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ea580c;
            color: #ffffff !important;
            border-color: #ea580c;
        }

        /* 🌟 無障礙聚焦與拖曳高亮樣式 */
        .drop-zone {
            border: 0.125rem dashed #ea580c;
            border-radius: 0.5rem;
            padding: 2rem 1rem;
            text-align: center;
            background: var(--panel-bg);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
            outline: none;
        }
        .drop-zone:hover, .drop-zone:focus-visible, .drop-zone.dragover { 
            background: #fff7ed; 
            border-color: #c2410c;
            outline: 0.2rem solid #ea580c;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.25rem 0;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.625rem 0.875rem;
            background: var(--panel-bg);
            border: 0.0625rem solid var(--border-light);
            border-radius: 0.375rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            gap: 0.5rem;
        }

        .file-btn-group {
            display: flex;
            gap: 0.375rem;
            align-items: center;
        }

        .btn-move {
            background: var(--card-bg);
            border: 0.0625rem solid var(--border-light);
            color: var(--body-text);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-move:hover { border-color: #ea580c; color: #ea580c; }

        .btn-action {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 1.5rem;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            box-shadow: 0 0.25rem 0.5rem rgba(234, 88, 12, 0.25);
        }
        .btn-action:hover, .btn-action:focus-visible { 
            background: #c2410c; 
            outline: 0.2rem solid #ea580c;
        }
        .btn-action:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .info-desc-box {
            background: var(--panel-bg, #f8fafc);
            border-top: 0.125rem solid var(--border-light, #cbd5e1);
            padding: 1.25rem 1rem;
            margin-top: 1.5rem;
            border-radius: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        .info-desc-box p {
            color: var(--desc-text);
            font-size: 0.9rem;
            line-height: 1.65;
            margin: 0;
            width: 100%;
        }

        .toast-notify {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(5rem);
            background: #0f172a;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            pointer-events: none;
        }

        .toast-notify.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- 🌟 無障礙跳頁連結：title 為補充操作提示說明，不重複連結內文 -->
    <a href="#main-content" class="skip-link" title="快速跳轉至網頁主要內容區塊">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:0.625rem; margin-bottom: 0.9375rem;">
            <ol style="list-style:none; padding:0; display:flex; gap:0.375rem; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區快速鍵 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:0.25rem;">:::主要內容區定位點</span>
                    </a>
                    <a href="index.html" title="點擊回到買便當首頁大廳" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / PDF 合併與拆分分割工具</li>
            </ol>
        </nav>

        <div class="pdf-card">
            <h1 style="color:var(--title-blue); font-size:1.35rem; margin-top:0; margin-bottom:0.75rem;">
                ✂️ PDF 合併與拆分分割工具
            </h1>

            <!-- 模式切換 (具備無障礙頁籤屬性) -->
            <div class="tab-group" role="tablist" aria-label="PDF 處理模式切換">
                <button type="button" class="tab-btn active" role="tab" aria-selected="true" title="切換至多個 PDF 檔案合併模式" onclick="switchMode('merge', this)">📑 檔案合併</button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" title="切換至指定頁碼拆分提取模式" onclick="switchMode('split', this)">✂️ 頁碼拆分</button>
            </div>

            <!-- 上傳區域 -->
            <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="點擊或拖曳 PDF 檔案至此處上傳" title="點擊或拖曳 PDF 檔案至此" onclick="document.getElementById('fileInput').click()" onkeydown="handleDropKeydown(event)">
                <span style="font-size:2.5rem; display:block; margin-bottom:0.5rem;" aria-hidden="true">📂</span>
                <span style="font-weight:bold; color:var(--body-text);" id="uploadNotice">點擊選擇或拖曳多個 PDF 檔案至此</span>
                <span style="font-size:0.8rem; color:var(--desc-text); display:block; margin-top:0.25rem;">(本機純前端處理，檔案絕不上傳)</span>
                <input type="file" id="fileInput" accept="application/pdf" multiple style="display:none;" onchange="handleFilesSelect(event)">
            </div>

            <!-- 合併模式列表 -->
            <div id="mergeSection">
                <ul class="file-list" id="fileList"></ul>
                <button type="button" class="btn-action" id="mergeBtn" disabled title="請先上傳至少兩個 PDF 檔案" onclick="processMerge()">
                    📑 開始合併 PDF 並下載
                </button>
            </div>

            <!-- 拆分模式輸入欄 -->
            <div id="splitSection" style="display:none;">
                <div style="margin-bottom:1rem;">
                    <label for="pageRange" style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); display:block; margin-bottom:0.375rem;">提取頁碼範圍 (例如: 1-3, 5, 8-10)：</label>
                    <input type="text" id="pageRange" class="form-control" title="請輸入要提取的頁碼範圍" placeholder="例如: 1-3, 5, 8">
                </div>
                <button type="button" class="btn-action" id="splitBtn" disabled title="請先上傳 PDF 檔案" onclick="processSplit()">
                    ✂️ 開始拆分提取 PDF 並下載
                </button>
            </div>

            <!-- 處理狀態提示 -->
            <div id="statusBox" role="status" aria-live="polite" style="margin-top:1rem; text-align:center; font-weight:bold; color:var(--desc-text);"></div>

            <!-- 📄 說明區 -->
            <div class="info-desc-box">
                <h2 style="color:var(--title-blue); font-size:1rem; margin-bottom:0.375rem; margin-top:0;">
                    💡 使用說明與安全保證
                </h2>
                <p style="max-width:40ch;">
                    本工具能將多個 PDF 檔案無縫合併，或將大文件依指定頁碼（如：1-5, 8）拆分成新檔案。所有 PDF 拆建皆在您的瀏覽器記憶體中完成，100% 零傳輸，完全確保文件機密性！
                </p>
            </div>
        </div>

    </main>

    <!-- 狀態提示 Toast (具備無障礙宣言) -->
    <div class="toast-notify" id="toastNotify" role="status" aria-live="polite">已成功生成 PDF 檔案！</div>

    <div id="global-footer"></div>

    <script>
        let filesArray = [];
        let currentMode = 'merge';

        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const selected = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
                    if (selected.length > 0) {
                        addFiles(selected);
                    } else {
                        alert('請選擇有效的 PDF 檔案！');
                    }
                }
            });
        });

        function handleDropKeydown(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                document.getElementById('fileInput').click();
            }
        }

        function switchMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');

            const fileInput = document.getElementById('fileInput');
            const notice = document.getElementById('uploadNotice');

            filesArray = [];
            renderFileList();

            if (mode === 'merge') {
                fileInput.multiple = true;
                notice.innerText = '點擊選擇或拖曳多個 PDF 檔案至此';
                document.getElementById('mergeSection').style.display = 'block';
                document.getElementById('splitSection').style.display = 'none';
            } else {
                fileInput.multiple = false;
                notice.innerText = '點擊選擇或拖曳一個 PDF 檔案進行拆分';
                document.getElementById('mergeSection').style.display = 'none';
                document.getElementById('splitSection').style.display = 'block';
            }
        }

        function handleFilesSelect(e) {
            const selectedFiles = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
            if (selectedFiles.length === 0) return;
            addFiles(selectedFiles);
        }

        function addFiles(selectedFiles) {
            if (currentMode === 'merge') {
                filesArray = filesArray.concat(selectedFiles);
            } else {
                filesArray = [selectedFiles[0]];
            }
            renderFileList();
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            const mergeBtn = document.getElementById('mergeBtn');
            const splitBtn = document.getElementById('splitBtn');

            list.innerHTML = '';
            filesArray.forEach((f, idx) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                let controlsHtml = `
                    <div class="file-btn-group">
                        ${currentMode === 'merge' ? `
                            <button type="button" class="btn-move" title="向上調整此檔案順序" onclick="moveFile(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>⬆️</button>
                            <button type="button" class="btn-move" title="向下調整此檔案順序" onclick="moveFile(${idx}, 1)" ${idx === filesArray.length - 1 ? 'disabled' : ''}>⬇️</button>
                        ` : ''}
                        <button type="button" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;" title="從列表中移除此檔案" onclick="removeFile(${idx})">❌ 移除</button>
                    </div>
                `;

                li.innerHTML = `
                    <span style="word-break:break-all;">📄 <b>${idx + 1}.</b> ${f.name} (${(f.size / 1024 / 1024).toFixed(2)} MB)</span>
                    ${controlsHtml}
                `;
                list.appendChild(li);
            });

            if (currentMode === 'merge') {
                mergeBtn.disabled = filesArray.length < 2;
            } else {
                splitBtn.disabled = filesArray.length !== 1;
            }
        }

        function moveFile(idx, direction) {
            const newIndex = idx + direction;
            if (newIndex < 0 || newIndex >= filesArray.length) return;
            const temp = filesArray[idx];
            filesArray[idx] = filesArray[newIndex];
            filesArray[newIndex] = temp;
            renderFileList();
        }

        function removeFile(idx) {
            filesArray.splice(idx, 1);
            renderFileList();
        }

        async function processMerge() {
            if (filesArray.length < 2) return;

            const status = document.getElementById('statusBox');
            status.innerText = '⏳ 正在合併 PDF 檔案，請稍候...';

            try {
                const { PDFDocument } = PDFLib;
                const mergedDoc = await PDFDocument.create();

                for (const file of filesArray) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedDoc.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach(page => mergedDoc.addPage(page));
                }

                const mergedBytes = await mergedDoc.save();
                downloadBlob(mergedBytes, 'mybanddown_merged.pdf');
                status.innerText = '🎉 PDF 合併成功！已自動下載。';
                showToast();
            } catch (err) {
                alert('合併失敗：' + err.message);
                status.innerText = '❌ 合併失敗，請重試。';
            }
        }

        async function processSplit() {
            if (filesArray.length !== 1) return;

            const rangeStr = document.getElementById('pageRange').value.trim();
            if (!rangeStr) {
                alert('請輸入要提取的頁碼範圍！');
                return;
            }

            const status = document.getElementById('statusBox');
            status.innerText = '⏳ 正在拆分 PDF 頁碼，請稍候...';

            try {
                const { PDFDocument } = PDFLib;
                const file = filesArray[0];
                const arrayBuffer = await file.arrayBuffer();
                const srcDoc = await PDFDocument.load(arrayBuffer);
                const totalPages = srcDoc.getPageCount();

                // 解析頁碼 (例如: 1-3, 5)
                const pagesToKeep = new Set();
                const parts = rangeStr.split(',');
                parts.forEach(part => {
                    const range = part.trim().split('-');
                    if (range.length === 1) {
                        const p = parseInt(range[0], 10);
                        if (p >= 1 && p <= totalPages) pagesToKeep.add(p - 1);
                    } else if (range.length === 2) {
                        const start = parseInt(range[0], 10);
                        const end = parseInt(range[1], 10);
                        for (let i = start; i <= end; i++) {
                            if (i >= 1 && i <= totalPages) pagesToKeep.add(i - 1);
                        }
                    }
                });

                if (pagesToKeep.size === 0) {
                    alert(`頁碼無效！該文件總共有 ${totalPages} 頁。`);
                    status.innerText = '';
                    return;
                }

                const newDoc = await PDFDocument.create();
                const indices = Array.from(pagesToKeep).sort((a, b) => a - b);
                const copiedPages = await newDoc.copyPages(srcDoc, indices);
                copiedPages.forEach(p => newDoc.addPage(p));

                const splitBytes = await newDoc.save();
                downloadBlob(splitBytes, `mybanddown_split_${file.name}`);
                status.innerText = '🎉 PDF 拆分成功！已自動下載。';
                showToast();

            } catch (err) {
                alert('拆分失敗：' + err.message);
                status.innerText = '❌ 拆分失敗，請重試。';
            }
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showToast() {
            const toast = document.getElementById('toastNotify');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }
    </script>
</body>
</html>
