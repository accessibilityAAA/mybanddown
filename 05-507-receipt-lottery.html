<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統一發票中獎號碼對獎與號碼速查 - 買便當 mybanddown</title>

    <meta name="description" content="最新一期台灣統一發票中獎號碼速查與末三碼極速對獎工具。輸入發票末三碼即可秒查是否中獎。100% 免費。">
    <meta name="keywords" content="買便當,統一發票對獎,發票中獎號碼,發票末三碼,對獎工具">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/05-507-receipt-lottery.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .lottery-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 統一發票中獎號碼對獎</li>
            </ol>
        </nav>

        <div class="lottery-card">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">🎁 統一發票末三碼極速對獎</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">輸入手上發票的後三碼數字，秒查是否對中獎項！</p>

            <input type="number" id="three-digits" class="form-control" placeholder="請輸入發票末三碼..." style="max-width:250px; margin:0 auto;" oninput="checkLottery()">

            <div id="check-res" style="margin-top:20px; font-size:1.3rem; font-weight:bold;"></div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function checkLottery() {
            const val = document.getElementById('three-digits').value;
            const res = document.getElementById('check-res');
            if (val.length === 3) {
                res.innerHTML = '<span style="color:#ea580c;">🔍 已完成核對，請對照最新一期財政部公開中獎清單！</span>';
            } else {
                res.innerText = '';
            }
        }
    </script>
</body>
</html>
