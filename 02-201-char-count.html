<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上字數統計與中英文分析 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上【字數統計與中英文分析】工具，即時計算中英文字數、標點符號、行數，並提供 IG 酷文字與全半形轉換。100% 免費本機純前端運算不上傳。">
    <meta name="keywords" content="字數統計,計算字數,中英文統計,IG字體,酷文字,小編工具,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/02-201-char-count.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <!-- 🌟 顯式引入 CSS 標籤，保證本機 file:// 開啟不失真 -->
    <link rel="stylesheet" href="css/main.css">

    <!-- 全站 Header / Footer 與元件注入腳本 -->
    <script src="js/components.js" defer></script>

    <style>
        .count-card {
            background: var(--card-bg, #ffffff);
            border: 0.0625rem solid var(--border-light, #e2e8f0);
            border-radius: 0.75rem;
            padding: 1.25rem;
            width: 100%;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.03);
            margin: 0.5rem 0;
            box-sizing: border-box;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .stat-box {
            background: var(--panel-bg, #f8fafc);
            border: 0.0625rem solid var(--border-light, #cbd5e1);
            border-radius: 0.5rem;
            padding: 0.875rem 0.625rem;
            text-align: center;
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ea580c;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--desc-text, #64748b);
            font-weight: bold;
            margin-top: 0.25rem;
        }

        textarea {
            width: 100%;
            height: 14rem;
            background: var(--input-bg, #ffffff);
            color: var(--body-text, #0f172a);
            border: 0.0625rem solid var(--border-light, #cbd5e1);
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            resize: vertical;
        }

        .action-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .btn-tool {
            background: var(--panel-bg);
            border: 0.0625rem solid var(--border-light);
            color: var(--body-text);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-tool:hover {
            border-color: #ea580c;
            color: #ea580c;
        }

        .fancy-output-box {
            background: var(--panel-bg);
            border: 0.0625rem solid var(--border-light);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1.25rem;
        }

        .fancy-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 0.0625rem dashed var(--border-light);
        }
    </style>
</head>
<body>

    <!-- 🌟 無障礙跳頁連結：title 為補充操作提示說明，不重複連結內文 -->
    <a href="#main-content" class="skip-link" title="快速跳轉至網頁主要內容區塊">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:0.625rem; margin-bottom: 0.9375rem;">
            <ol style="list-style:none; padding:0; display:flex; gap:0.375rem; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區快速鍵 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:0.25rem;">:::主要內容區定位點</span>
                    </a>
                    <a href="index.html" title="點擊回到買便當首頁大廳" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / 線上字數統計與中英文分析</li>
            </ol>
        </nav>

        <div class="count-card">
            <h1 style="color:var(--title-blue); font-size:1.35rem; margin-top:0; margin-bottom:0.75rem;">
                📊 線上字數統計與社群文字分析
            </h1>

            <!-- 實時統計面板 -->
            <div class="stats-grid" role="status" aria-live="polite">
                <div class="stat-box">
                    <div class="stat-num" id="totalChar">0</div>
                    <div class="stat-label">總字數 (含空白)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="noSpaceChar">0</div>
                    <div class="stat-label">純字數 (不含空白)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="zhCount">0</div>
                    <div class="stat-label">中文字數</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="enWordCount">0</div>
                    <div class="stat-label">英文單字數</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="numCount">0</div>
                    <div class="stat-label">數字個數</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="lineCount">0</div>
                    <div class="stat-label">總行數</div>
                </div>
            </div>

            <!-- 輸入區域 -->
            <label for="textInput" style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.375rem; display:block;">請貼上或輸入要統計的文字內文：</label>
            <textarea id="textInput" name="textInput" placeholder="請在此輸入或貼上文章內容..." title="請輸入要進行字數統計與特效轉換的文字" oninput="analyzeText()"></textarea>

            <!-- 文字清理與處理按鈕 -->
            <div class="action-bar">
                <button type="button" class="btn-tool" title="清除所有多餘的空白列與換行" onclick="cleanExtraLines()">🧹 清理空行</button>
                <button type="button" class="btn-tool" title="將英文全部轉為大寫" onclick="changeCase('upper')">🔠 全部大寫</button>
                <button type="button" class="btn-tool" title="將英文全部轉為小寫" onclick="changeCase('lower')">🔡 全部小寫</button>
                <button type="button" class="btn-tool" title="將全形字體轉換為半形" onclick="toHalfWidth()">🌗 全形轉半形</button>
                <button type="button" class="btn-tool" title="清空上方輸入框的所有文字內容" onclick="clearText()" style="color:#ef4444;">🗑️ 清空文字</button>
            </div>

            <!-- IG 特效酷字體產生 -->
            <div class="fancy-output-box">
                <h2 style="font-size:1.05rem; color:var(--title-blue); margin-top:0; margin-bottom:0.75rem;">
                    ✨ IG 酷文字生成 (適用於輸入框中的英文字母)
                </h2>
                <div id="fancyList">
                    <p style="color:var(--desc-text); font-size:0.875rem;">請在上方輸入框輸入英文，此處將同步生成社群酷字體！</p>
                </div>
            </div>

            <!-- 說明區 -->
            <div style="background:var(--panel-bg); border-top:0.125rem solid var(--border-light); padding:1rem 0.5rem 0 0.5rem; margin-top:1.5rem;">
                <h3 style="color:var(--title-blue); font-size:1rem; margin-bottom:0.375rem;">
                    功能介紹
                </h3>
                <p style="color:var(--desc-text); font-size:0.875rem; line-height:1.6; max-width:40ch;">
                    本工具能精準識別中文、英文單字、數字與標點符號。針對社群小編需求，支援一鍵清理空行與 IG 酷字體轉換，所有資料皆於本機瀏覽器運算，安全不上傳。
                </p>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function analyzeText() {
            const text = document.getElementById('textInput').value;

            // 總字數
            document.getElementById('totalChar').innerText = text.length;

            // 不含空白
            const noSpace = text.replace(/\s/g, '');
            document.getElementById('noSpaceChar').innerText = noSpace.length;

            // 中文字數 (CJK 範圍)
            const zhMatch = text.match(/[\u4e00-\u9fa5]/g);
            document.getElementById('zhCount').innerText = zhMatch ? zhMatch.length : 0;

            // 英文單字數
            const enMatch = text.match(/[a-zA-Z]+/g);
            document.getElementById('enWordCount').innerText = enMatch ? enMatch.length : 0;

            // 數字個數
            const numMatch = text.match(/[0-9]/g);
            document.getElementById('numCount').innerText = numMatch ? numMatch.length : 0;

            // 行數
            const lines = text.length === 0 ? 0 : text.split(/\r\n|\r|\n/).length;
            document.getElementById('lineCount').innerText = lines;

            generateFancyText(text);
        }

        function cleanExtraLines() {
            const input = document.getElementById('textInput');
            input.value = input.value.split('\n').filter(line => line.trim() !== '').join('\n');
            analyzeText();
        }

        function changeCase(type) {
            const input = document.getElementById('textInput');
            input.value = type === 'upper' ? input.value.toUpperCase() : input.value.toLowerCase();
            analyzeText();
        }

        function toHalfWidth() {
            const input = document.getElementById('textInput');
            input.value = input.value.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0)).replace(/\u3000/g, ' ');
            analyzeText();
        }

        function clearText() {
            document.getElementById('textInput').value = '';
            analyzeText();
        }

        // IG 特效字體字典與地圖
        function generateFancyText(text) {
            const listContainer = document.getElementById('fancyList');
            const enOnly = text.replace(/[^a-zA-Z]/g, '');

            if (!enOnly) {
                listContainer.innerHTML = '<p style="color:var(--desc-text); font-size:0.875rem;">請在上方輸入英文內容，此處將同步生成特效酷字體！</p>';
                return;
            }

            const styles = [
                { name: '圓圈黑底', font: mapFont(enOnly, 0x1F150) },
                { name: '雙線字體', font: mapFont(enOnly, 0x1D538) },
                { name: '全形字體', font: mapFullWidth(enOnly) }
            ];

            let html = '';
            styles.forEach(s => {
                html += `
                    <div class="fancy-item">
                        <span style="font-size:1.1rem; font-weight:bold; color:var(--body-text); word-break:break-all;">${s.name}：${s.font}</span>
                        <button type="button" class="btn-tool" style="font-size:0.75rem; flex-shrink:0;" title="點擊複製 ${s.name} 特效文字" onclick="copyFancy('${s.font}')">📋 複製</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function mapFont(str, baseCode) {
            return str.split('').map(ch => {
                const code = ch.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCodePoint(baseCode + (code - 65));
                } else if (code >= 97 && code <= 122) {
                    return String.fromCodePoint(baseCode + (code - 97));
                }
                return ch;
            }).join('');
        }

        function mapFullWidth(str) {
            return str.split('').map(ch => {
                const code = ch.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(code + 0xfee0);
                } else if (code >= 97 && code <= 122) {
                    return String.fromCharCode(code + 0xfee0);
                }
                return ch;
            }).join('');
        }

        function copyFancy(val) {
            navigator.clipboard.writeText(val).then(() => {
                alert('已成功複製特效文字！');
            });
        }
    </script>
</body>
</html>
