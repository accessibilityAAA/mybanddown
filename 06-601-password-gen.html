<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高強度隨機密碼產生器與安全檢測 - 買便當 mybanddown</title>

    <meta name="description" content="線上自訂高強度隨機安全密碼。支援大小寫英文、數字與符號組合，即時進行密碼安全強度分析，本機即時生成不留存。">
    <meta name="keywords" content="買便當,密碼產生器,隨機密碼,安全密碼,強密碼,密碼強度檢測">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/06-601-password-gen.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .pwd-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }
        .pwd-output {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #ea580c;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            margin: 20px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 高強度隨機密碼產生器</li>
            </ol>
        </nav>

        <div class="pwd-card">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">🔑 高強度隨機密碼產生器</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">為您的帳號產生極度安全且難以破解的高強度防盜密碼。</p>

            <div class="pwd-output" id="pwdDisplay">點擊生成密碼</div>

            <button type="button" class="form-control" style="width:auto; background:#ea580c; color:#fff; font-weight:bold; cursor:pointer;" onclick="genPassword()">⚡ 隨機生成新密碼</button>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function genPassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
            let res = "";
            for (let i = 0; i < 16; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pwdDisplay').innerText = res;
        }
        genPassword();
    </script>
</body>
</html>
