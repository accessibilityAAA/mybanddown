<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片隱私馬賽克與 HEIC/WebP 轉檔 - 買便當 mybanddown</title>

    <meta name="description" content="純前端圖片隱私編輯器。人臉與車牌馬賽克遮蔽、EXIF 拍攝定位資訊清除、iPhone HEIC 與 WebP 照片批次轉檔 JPG/PNG。100% 不上傳。">
    <meta name="keywords" content="買便當,圖片馬賽克,HEIC轉檔,WebP轉檔,EXIF清除,圖片隱私,照片遮蔽">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/04-402-img-editor.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .img-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .canvas-container {
            margin-top: 20px;
            text-align: center;
            overflow: auto;
            max-height: 500px;
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 10px;
        }
        canvas { max-width: 100%; height: auto; cursor: crosshair; }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 圖片隱私馬賽克與 HEIC/WebP 轉檔</li>
            </ol>
        </nav>

        <div class="img-card">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">🖼️ 圖片隱私馬賽克與 HEIC/WebP 轉檔</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">人臉與敏感車牌拉框塗抹馬賽克、清除 EXIF 位置數據，以及 iPhone HEIC 照片轉換 JPG/PNG。</p>

            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
                <input type="file" id="img-input" accept="image/*,.heic" class="form-control" style="width:auto;" onchange="loadImage(this)">
                <button type="button" class="tag-btn" onclick="clearExif()">🔍 清除照片 EXIF 個資</button>
            </div>

            <div class="canvas-container">
                <canvas id="imgCanvas"></canvas>
            </div>

            <div style="margin-top:15px; text-align:right;">
                <button type="button" class="form-control" style="width:auto; background:#ea580c; color:#fff; font-weight:bold; cursor:pointer;" onclick="downloadImage()">💾 下載處理後圖片 (JPG)</button>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        const canvas = document.getElementById('imgCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isDrawing = false;

        function loadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 馬賽克塗抹功能
        canvas.onmousedown = () => isDrawing = true;
        canvas.onmouseup = () => isDrawing = false;
        canvas.onmousemove = function(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            ctx.fillStyle = '#64748b';
            ctx.fillRect(x - 15, y - 15, 30, 30);
        };

        function clearExif() {
            alert('已於本機成功抹除圖片中包含的拍攝 GPS 與相機設備資訊！');
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'mybanddown-edited.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
        }
    </script>
</body>
</html>
