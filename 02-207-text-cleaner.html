<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社群零寬度空白與換行格式清理器 - 買便當 mybanddown</title>

    <meta name="description" content="IG 與 FB 貼文排版救星！自動清除多餘重複空白、清理異常換行，並補上零寬度隱形空白，解決貼文縮排跑版問題。">
    <meta name="keywords" content="買便當,IG空白,零寬度空白,FB換行,貼文排版,空白清理器">
    <meta name="author" content="買便當 mybanddown">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/02-207-text-cleaner.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <link rel="stylesheet" href="css/main.css">
    <script src="js/components.js" defer></script>

    <style>
        .clean-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-bottom: 15px;">
            <ol style="list-style:none; padding:0; display:flex; gap:6px; font-size:0.9rem; color:#64748b;">
                <li><a href="index.html" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a></li>
                <li> / 社群零寬度空白與換行格式清理器</li>
            </ol>
        </nav>

        <div class="clean-card">
            <h1 style="font-size: 1.5rem; color: var(--title-blue); margin-bottom: 8px;">␣ 社群零寬度空白與換行格式清理器</h1>
            <p style="color: var(--desc-text); margin-bottom: 20px;">自動修正 IG/FB 貼文換行被吃掉與多餘空白問題。</p>

            <textarea id="clean-input" class="form-control" rows="6" placeholder="請貼上貼文內容..."></textarea>
            <button type="button" class="form-control" style="margin-top:10px; background:#ea580c; color:#fff; font-weight:bold; cursor:pointer;" onclick="cleanText()">✨ 淨化排版並複製</button>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function cleanText() {
            let txt = document.getElementById('clean-input').value;
            txt = txt.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n\u200B\n');
            navigator.clipboard.writeText(txt).then(() => alert('排版已優化並複製！'));
        }
    </script>
</body>
</html>
