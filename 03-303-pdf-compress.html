<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上 PDF 高品質極速壓縮與瘦身工具 - 買便當 mybanddown</title>

    <meta name="keywords" content="PDF壓縮,PDF瘦身,PDF檔案縮小,報名檔案壓縮,PDF工具,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">

    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/03-303-pdf-compress.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <!-- 🌟 顯式引入 CSS 標籤，保證本機 file:// 開啟不失真 -->
    <link rel="stylesheet" href="css/main.css">

    <!-- 輕量獨立 PDF 處理庫 pdf-lib 與 pdf.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/components.js" defer></script>

    <style>
        .pdf-card {
            background: var(--card-bg, #ffffff);
            border: 0.0625rem solid var(--border-light, #e2e8f0);
            border-radius: 0.75rem;
            padding: 1.25rem;
            width: 100%;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.03);
            margin: 0.5rem 0;
            box-sizing: border-box;
        }

        .pdf-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
            width: 100%;
        }

        .pdf-panel {
            flex: 1 1 18.75rem;
            min-width: 0;
        }

        .pdf-preview-box {
            flex: 1 1 22.5rem;
            background: var(--panel-bg, #f8fafc);
            border: 0.0625rem solid var(--border-light, #cbd5e1);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 0;
        }

        /* 🌟 無障礙聚焦與拖曳高亮樣式 */
        .drop-zone {
            border: 0.125rem dashed #ea580c;
            border-radius: 0.5rem;
            padding: 2rem 1rem;
            text-align: center;
            background: var(--panel-bg);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
            outline: none;
        }
        .drop-zone:hover, .drop-zone:focus-visible, .drop-zone.dragover { 
            background: #fff7ed; 
            border-color: #c2410c;
            outline: 0.2rem solid #ea580c;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .btn-compress {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 1.5rem;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            box-shadow: 0 0.25rem 0.5rem rgba(234, 88, 12, 0.25);
        }
        .btn-compress:hover, .btn-compress:focus-visible { 
            background: #c2410c; 
            outline: 0.2rem solid #ea580c;
        }
        .btn-compress:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .stat-badge {
            background: #22c55e;
            color: #ffffff;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .info-desc-box {
            background: var(--panel-bg, #f8fafc);
            border-top: 0.125rem solid var(--border-light, #cbd5e1);
            padding: 1.25rem 1rem;
            margin-top: 1.5rem;
            border-radius: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        .info-desc-box p {
            color: var(--desc-text);
            font-size: 0.9rem;
            line-height: 1.65;
            margin: 0;
            width: 100%;
        }

        .toast-notify {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(5rem);
            background: #0f172a;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            pointer-events: none;
        }

        .toast-notify.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- 🌟 無障礙跳頁連結：title 為補充操作提示說明，不重複連結內文 -->
    <a href="#main-content" class="skip-link" title="快速跳轉至網頁主要內容區塊">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:0.625rem; margin-bottom: 0.9375rem;">
            <ol style="list-style:none; padding:0; display:flex; gap:0.375rem; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區快速鍵 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:0.25rem;">:::主要內容區定位點</span>
                    </a>
                    <a href="index.html" title="點擊回到買便當首頁大廳" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / 線上 PDF 高品質極速壓縮與瘦身工具</li>
            </ol>
        </nav>

        <div class="pdf-card">
            <h1 style="color:var(--title-blue); font-size:1.35rem; margin-top:0; margin-bottom:0.75rem;">
                📉 線上 PDF 高品質極速壓縮與瘦身工具
            </h1>

            <div class="pdf-layout">
                <!-- 左側：設定控制台 -->
                <div class="pdf-panel">
                    <!-- 🌟 拖曳與鍵盤聚焦區域 -->
                    <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="點擊或拖曳 PDF 檔案至此處上傳" title="點擊或拖曳 PDF 檔案至此" onclick="document.getElementById('fileInput').click()" onkeydown="handleDropKeydown(event)">
                        <span style="font-size:2.5rem; display:block; margin-bottom:0.5rem;" aria-hidden="true">📂</span>
                        <span style="font-weight:bold; color:var(--body-text);" id="uploadNotice">點擊選擇或拖曳需要壓縮的 PDF 檔案</span>
                        <span style="font-size:0.8rem; color:var(--desc-text); display:block; margin-top:0.25rem;">(本機純前端處理，檔案絕不上傳)</span>
                        <input type="file" id="fileInput" accept="application/pdf" style="display:none;" onchange="handleFileSelect(event)">
                    </div>

                    <div class="form-group">
                        <label for="compressLevel" style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.375rem; display:block;">壓縮品質模式：</label>
                        <select id="compressLevel" class="form-control" title="請選擇 PDF 壓縮強度模式">
                            <option value="high">🚀 極致高壓模式 (體積最小，適合報名系統限制)</option>
                            <option value="balanced" selected>⚖️ 平衡推薦模式 (兼顧畫質與體積)</option>
                            <option value="low">🖼️ 高品質清晰模式 (輕度瘦身，適合列印)</option>
                        </select>
                    </div>

                    <button type="button" class="btn-compress" id="compressBtn" disabled title="請先上傳 PDF 檔案" onclick="processCompress()">
                        📉 開始極速壓縮 PDF
                    </button>
                </div>

                <!-- 右側：壓縮成果與狀態展台 -->
                <div class="pdf-preview-box">
                    <div id="statusBox" role="status" aria-live="polite" style="color:var(--desc-text); font-weight:bold;">
                        請在左側上傳 PDF 檔案以開始瘦身壓縮作業！
                    </div>
                </div>
            </div>

            <!-- 📄 說明區 -->
            <div class="info-desc-box">
                <h2 style="color:var(--title-blue); font-size:1rem; margin-bottom:0.375rem; margin-top:0;">
                    💡 使用說明與壓縮優勢
                </h2>
                <p style="max-width:40ch;">
                    專為解決各類考試、求職或政府報名系統（限制 2MB 或 5MB 內）檔案過大問題而設計。透過重新繪製高清晰圖像並清理 PDF 內部多餘詮釋資料（Metadata），迅速降低檔案體積。100% 於您的瀏覽器本地完成，個人隱私絕不上傳！
                </p>
            </div>
        </div>

    </main>

    <!-- 狀態提示 Toast (具備無障礙宣言) -->
    <div class="toast-notify" id="toastNotify" role="status" aria-live="polite">已成功下載瘦身後的 PDF！</div>

    <div id="global-footer"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentFile = null;
        let currentArrayBuffer = null;

        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    loadPdfFile(file);
                }
            });
        });

        function handleDropKeydown(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                document.getElementById('fileInput').click();
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            loadPdfFile(file);
        }

        function loadPdfFile(file) {
            if (!file || file.type !== 'application/pdf') {
                alert('請選擇有效的 PDF 檔案！');
                return;
            }

            currentFile = file;
            const reader = new FileReader();
            reader.onload = function(evt) {
                currentArrayBuffer = evt.target.result;
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                document.getElementById('statusBox').innerHTML = `
                    <span style="color:#22c55e; font-size:1.1rem; display:block; margin-bottom:0.5rem;">✅ 已成功載入 PDF！</span>
                    <span style="font-size:0.95rem; color:var(--body-text); font-weight:bold; word-break:break-all;">${file.name}</span>
                    <span style="font-size:0.875rem; color:var(--desc-text); display:block; margin-top:0.25rem;">原始大小：${sizeMB} MB</span>
                `;
                document.getElementById('compressBtn').disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }

        async function processCompress() {
            if (!currentArrayBuffer || !currentFile) return;

            const btn = document.getElementById('compressBtn');
            const statusBox = document.getElementById('statusBox');
            btn.disabled = true;
            statusBox.innerText = '⏳ 正在進行本機高階圖像重採樣壓縮中，請稍候...';

            try {
                const level = document.getElementById('compressLevel').value;
                let scale = 1.2;
                let quality = 0.6;

                if (level === 'high') {
                    scale = 0.9;
                    quality = 0.45;
                } else if (level === 'balanced') {
                    scale = 1.2;
                    quality = 0.65;
                } else if (level === 'low') {
                    scale = 1.5;
                    quality = 0.8;
                }

                const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(currentArrayBuffer) });
                const pdfDoc = await loadingTask.promise;
                const pageCount = pdfDoc.numPages;

                const { PDFDocument } = PDFLib;
                const newPdfDoc = await PDFDocument.create();

                for (let i = 1; i <= pageCount; i++) {
                    statusBox.innerText = `⏳ 正在本機壓縮第 ${i} / ${pageCount} 頁...`;

                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const imgDataUrl = canvas.toDataURL('image/jpeg', quality);
                    const jpgImage = await newPdfDoc.embedJpg(imgDataUrl);

                    const newPage = newPdfDoc.addPage([viewport.width / scale, viewport.height / scale]);
                    newPage.drawImage(jpgImage, {
                        x: 0,
                        y: 0,
                        width: viewport.width / scale,
                        height: viewport.height / scale,
                    });

                    // 釋放記憶體
                    canvas.width = 0;
                    canvas.height = 0;
                }

                const pdfBytes = await newPdfDoc.save();
                const newSizeMB = (pdfBytes.length / 1024 / 1024).toFixed(2);
                const originalSizeMB = (currentFile.size / 1024 / 1024).toFixed(2);
                const savedPercent = Math.max(0, Math.round((1 - pdfBytes.length / currentFile.size) * 100));

                statusBox.innerHTML = `
                    <span style="color:#22c55e; font-size:1.15rem; display:block; margin-bottom:0.5rem;">🎉 壓縮成功！</span>
                    <div style="font-size:0.9rem; color:var(--body-text); line-height:1.6;">
                        原始大小：${originalSizeMB} MB<br>
                        壓縮後大小：<strong style="color:#ea580c;">${newSizeMB} MB</strong>
                    </div>
                    <span class="stat-badge">瘦身省下 ${savedPercent}% 空間！</span>
                `;

                downloadBlob(pdfBytes, `compressed_${currentFile.name}`);
                showToast();

            } catch (err) {
                alert('壓縮失敗：' + err.message);
                statusBox.innerText = '❌ 壓縮過程發生錯誤，請重試。';
            } finally {
                btn.disabled = false;
            }
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showToast() {
            const toast = document.getElementById('toastNotify');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }
    </script>
</body>
</html>
