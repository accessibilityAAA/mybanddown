<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上一維條碼產生器 - 買便當 mybanddown</title>
    
    <meta name="description" content="免費線上【一維條碼產生器】工具，支援 Code 128、EAN-13、Code 39 商品條碼製作，自訂尺寸顏色並導出 SVG / PNG。100% 免費本機純前端運算不上傳。">
    <meta name="keywords" content="一維條碼產生器,條碼製作,Code128條碼,EAN13商品條碼,條碼標籤,小編工具,買便當,mybanddown">
    <meta name="author" content="買便當 mybanddown">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ea580c">

    <link rel="canonical" href="https://www.mybanddown.com/02-205-barcode-gen.html">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>

    <!-- 🌟 顯式引入 CSS 標籤，保證本機 file:// 開啟不失真 -->
    <link rel="stylesheet" href="css/main.css">

    <!-- 輕量獨立 JsBarcode 條碼庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="js/components.js" defer></script>

    <style>
        .barcode-card {
            background: var(--card-bg, #ffffff);
            border: 0.0625rem solid var(--border-light, #e2e8f0);
            border-radius: 0.75rem;
            padding: 1.25rem;
            width: 100%;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.03);
            margin: 0.5rem 0;
            box-sizing: border-box;
        }

        .barcode-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
            width: 100%;
        }

        .barcode-panel {
            flex: 1 1 18.75rem;
            min-width: 0;
        }

        .barcode-preview-box {
            flex: 1 1 18.75rem;
            background: var(--panel-bg, #f8fafc);
            border: 0.0625rem solid var(--border-light, #cbd5e1);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 0;
        }

        .barcode-stage {
            padding: 1.5rem 1rem;
            background: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.05);
            max-width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .barcode-stage svg {
            max-width: 100%;
            height: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            justify-content: center;
        }

        .btn-download {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 1.5rem;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 0.25rem 0.5rem rgba(234, 88, 12, 0.25);
        }
        .btn-download:hover, .btn-download:focus-visible { 
            background: #c2410c; 
            outline: 0.2rem solid #ea580c;
        }

        .btn-download-alt {
            background: #64748b;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 1.5rem;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-download-alt:hover, .btn-download-alt:focus-visible { 
            background: #475569; 
            outline: 0.2rem solid #64748b;
        }

        .info-desc-box {
            background: var(--panel-bg, #f8fafc);
            border-top: 0.125rem solid var(--border-light, #cbd5e1);
            padding: 1.25rem 1rem;
            margin-top: 1.5rem;
            border-radius: 0.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        .info-desc-box p {
            color: var(--desc-text);
            font-size: 0.9rem;
            line-height: 1.65;
            margin: 0;
            width: 100%;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 0.375rem;
            display: none;
        }

        @media (max-width: 28rem) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 🌟 無障礙跳頁連結：title 為補充操作提示說明，不重複連結內文 -->
    <a href="#main-content" class="skip-link" title="快速跳轉至網頁主要內容區塊">跳過導覽選單，直接進入主要內容區</a>
    <div id="global-header"></div>

    <main class="main-container" id="main-content" role="main" tabindex="-1">

        <nav aria-label="麵包屑導航" class="breadcrumb" style="margin-top:0.625rem; margin-bottom: 0.9375rem;">
            <ol style="list-style:none; padding:0; display:flex; gap:0.375rem; font-size:0.9rem; color:#64748b;">
                <li>
                    <a href="javascript:void(0)" id="accesskey-C" accesskey="C" tabindex="0" title="定位主要內容區快速鍵 [Alt+C]" style="text-decoration:none; color:inherit;">
                        <span style="color:#ea580c; font-weight:bold; margin-right:0.25rem;">:::主要內容區定位點</span>
                    </a>
                    <a href="index.html" title="點擊回到買便當首頁大廳" style="color:#ea580c; font-weight:bold; text-decoration:none;">首頁</a>
                </li>
                <li aria-current="page"> / 線上一維條碼產生器</li>
            </ol>
        </nav>

        <div class="barcode-card">
            <h1 style="color:var(--title-blue); font-size:1.35rem; margin-top:0; margin-bottom:0.75rem;">
                ║▌ 線上一維條碼產生器 (Barcode Generator)
            </h1>

            <div class="barcode-layout">
                <!-- 左側：輸入與客製化控制面板 -->
                <div class="barcode-panel">
                    <div class="form-group">
                        <label for="barcodeFormat" style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.375rem; display:block;">條碼編碼格式：</label>
                        <select id="barcodeFormat" class="form-control" title="請選擇條碼編碼格式" onchange="generateBarcode()">
                            <option value="CODE128" selected>CODE128 (通用英文與數字，推薦)</option>
                            <option value="EAN13">EAN-13 (國際零售商品，須13位數字)</option>
                            <option value="EAN8">EAN-8 (小型商品，須8位數字)</option>
                            <option value="CODE39">CODE39 (工業與倉儲物流專用)</option>
                            <option value="UPC">UPC-A (北美商品，須12位數字)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="barcodeInput" style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.375rem; display:block;">輸入條碼內容數字/文字：</label>
                        <input type="text" id="barcodeInput" class="form-control" title="請輸入要產生的條碼文字或號碼" value="MYBANDDOWN2026" placeholder="請輸入條碼內容..." oninput="generateBarcode()">
                        <div class="error-msg" id="errorMsg" role="status" aria-live="polite">⚠️ 輸入內容格式不符合選擇的條碼規範！</div>
                    </div>

                    <div class="grid-2col">
                        <div>
                            <label for="barcodeHeight" style="font-size:0.85rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.25rem; display:block;">條碼高度 (px)：</label>
                            <input type="number" id="barcodeHeight" value="80" min="30" max="250" class="form-control" title="請輸入條碼高度" oninput="generateBarcode()">
                        </div>
                        <div>
                            <label for="barcodeWidth" style="font-size:0.85rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.25rem; display:block;">線條寬度 (條寬)：</label>
                            <input type="number" id="barcodeWidth" value="2" min="1" max="5" class="form-control" title="請輸入條碼單線線條寬度" oninput="generateBarcode()">
                        </div>
                    </div>

                    <div class="grid-2col">
                        <div>
                            <label for="colorLine" style="font-size:0.85rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.25rem; display:block;">條碼顏色：</label>
                            <input type="color" id="colorLine" value="#000000" class="form-control" style="height:2.5rem; cursor:pointer;" title="請選擇條碼線條顏色" onchange="generateBarcode()">
                        </div>
                        <div>
                            <label for="colorBg" style="font-size:0.85rem; font-weight:bold; color:var(--desc-text); margin-bottom:0.25rem; display:block;">背景色彩：</label>
                            <input type="color" id="colorBg" value="#ffffff" class="form-control" style="height:2.5rem; cursor:pointer;" title="請選擇背景色彩" onchange="generateBarcode()">
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="font-size:0.875rem; color:var(--desc-text); cursor:pointer;">
                            <input type="checkbox" id="showText" checked title="勾選以在條碼下方顯示可讀文字" onchange="generateBarcode()"> 🔤 在條碼下方顯示文字 (Human Readable)
                        </label>
                    </div>
                </div>

                <!-- 右側：實時條碼展示與下載按鈕 -->
                <div class="barcode-preview-box">
                    <span style="font-size:0.9rem; font-weight:bold; color:var(--desc-text); margin-bottom:1rem;">║▌ 一維條碼實時繪製展台</span>
                    
                    <div class="barcode-stage">
                        <svg id="barcodeSvg" role="img" aria-label="實時生成的一維條碼圖形"></svg>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn-download" title="點擊下載 SVG 向量圖檔（適合排版列印）" onclick="downloadSVG()">
                            ⬇️ 下載 SVG 向量檔
                        </button>
                        <button type="button" class="btn-download-alt" title="點擊下載 PNG 圖片檔" onclick="downloadPNG()">
                            🖼️ 下載 PNG 圖片檔
                        </button>
                    </div>
                </div>
            </div>

            <!-- 📄 說明區 -->
            <div class="info-desc-box">
                <h2 style="color:var(--title-blue); font-size:1rem; margin-bottom:0.375rem; margin-top:0;">
                    💡 使用說明與編碼格式建議
                </h2>
                <p style="max-width:40ch;">
                    本工具可迅速產生超商、物流、商品管理使用的高清晰度一維條碼。一般文字與數字混合建議選擇 <strong>CODE128</strong>；國際零售商品請選擇 <strong>EAN-13</strong>（須為13位純數字）。所有過程均於本機計算，圖片可匯出為 SVG 向量檔與 PNG 圖檔。
                </p>
            </div>
        </div>

    </main>

    <div id="global-footer"></div>

    <script>
        function generateBarcode() {
            const format = document.getElementById('barcodeFormat').value;
            const inputVal = document.getElementById('barcodeInput').value.trim();
            const height = parseInt(document.getElementById('barcodeHeight').value, 10) || 80;
            const width = parseInt(document.getElementById('barcodeWidth').value, 10) || 2;
            const lineColor = document.getElementById('colorLine').value;
            const bgColor = document.getElementById('colorBg').value;
            const displayValue = document.getElementById('showText').checked;
            const errorMsg = document.getElementById('errorMsg');
            const svgEl = document.getElementById('barcodeSvg');

            if (!inputVal) {
                errorMsg.style.display = 'none';
                return;
            }

            try {
                JsBarcode("#barcodeSvg", inputVal, {
                    format: format,
                    width: width,
                    height: height,
                    displayValue: displayValue,
                    lineColor: lineColor,
                    background: bgColor,
                    margin: 10,
                    fontSize: 16,
                    valid: function(valid) {
                        if (valid) {
                            errorMsg.style.display = 'none';
                            svgEl.setAttribute('aria-label', `實時生成的一維條碼，格式為 ${format}，內容為：${inputVal}`);
                        } else {
                            errorMsg.style.display = 'block';
                            svgEl.setAttribute('aria-label', `條碼格式錯誤，內容不符合 ${format} 規範`);
                        }
                    }
                });
            } catch (e) {
                errorMsg.style.display = 'block';
                svgEl.setAttribute('aria-label', `條碼格式錯誤，內容不符合 ${format} 規範`);
            }
        }

        function downloadSVG() {
            const svg = document.getElementById('barcodeSvg');
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);

            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const svgBlob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
            const svgUrl = URL.createObjectURL(svgBlob);
            const downloadLink = document.createElement("a");
            downloadLink.href = svgUrl;
            downloadLink.download = "mybanddown_barcode.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(svgUrl);
        }

        function downloadPNG() {
            const svg = document.getElementById('barcodeSvg');
            const bgColor = document.getElementById('colorBg').value;
            const serializer = new XMLSerializer();
            const svgStr = serializer.serializeToString(svg);
            const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const bbox = svg.getBBox();
                canvas.width = (bbox.width || 300) + 20;
                canvas.height = (bbox.height || 120) + 20;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 10, 10);
                
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = 'mybanddown_barcode.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        document.addEventListener('DOMContentLoaded', generateBarcode);
    </script>
</body>
</html>
